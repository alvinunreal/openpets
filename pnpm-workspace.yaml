packages:
  - "apps/*"
  - "packages/*"
supportedArchitectures:
  os:
    - darwin
    - win32
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
allowBuilds:
  '@google/genai': true
  electron-winstaller: false
  esbuild: true
  get-windows: true
  koffi: true
  openclaw: set this to true or false
  protobufjs: true
  sharp: true
  tree-sitter-bash: set this to true or false
  workerd: true
